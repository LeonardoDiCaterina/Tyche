[build-system]
requires = ["scikit-build-core>=0.4.3", "pybind11>=2.11"]
build-backend = "scikit_build_core.build"

[project]
name = "tyche"
version = "0.1.0"
description = "Tyche — a custom JAX-compatible pseudo-random number generator"
requires-python = ">=3.10"
dependencies = [
    "jax>=0.4.23,<0.6.0",
    "jaxlib>=0.4.23,<0.6.0",
    "numpy>=1.24,<2.0",
    "scipy>=1.12",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-benchmark>=4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests", "benchmarks"]
pythonpath = ["src", "tests"]
markers = [
    "statistical: slow statistical quality tests (deselect with '-m not statistical')",
    "crush: PractRand crush tests (require RNG_test binary on PATH)",
    "benchmark: performance benchmarks",
]

[tool.setuptools.packages.find]
where = ["src"]